name: Render HyperFrames Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Render Video with HyperFrames (Docker mode)
        run: npx hyperframes render --docker --output dist/stoic_defense.mp4

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: stoic-defense-short
          path: dist/stoic_defense.mp4
          retention-days: 7
