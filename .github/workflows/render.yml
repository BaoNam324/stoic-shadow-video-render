name: Render HyperFrames Video

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

      - name: Install Dependencies
        run: npm install

      - name: Install Chrome Headless Shell
        run: |
          OUTPUT=$(npx @puppeteer/browsers install chrome-headless-shell)
          echo "$OUTPUT"
          SHELL_PATH=$(echo "$OUTPUT" | awk '{print $2}')
          echo "Installed chrome-headless-shell at: $SHELL_PATH"
          echo "HYPERFRAMES_BROWSER_PATH=$SHELL_PATH" >> $GITHUB_ENV

      - name: Render Video with HyperFrames
        run: npx hyperframes render --output dist/stoic_defense.mp4

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: stoic-defense-short
          path: dist/stoic_defense.mp4
          retention-days: 7
