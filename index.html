<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3 Cold Rules Stoic Shadow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #09090b;
      overflow: hidden;
    }

    /* Dramatic Radial Lighting */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 38%, rgba(245, 158, 11, 0.15) 0%, rgba(9, 9, 11, 0.98) 75%);
      z-index: 1;
    }

    /* Film Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 240px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      z-index: 20;
    }

    /* Brand Watermark */
    .brand-tag {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: 26px;
      letter-spacing: 7px;
      font-weight: 800;
      text-transform: uppercase;
      z-index: 15;
    }

    /* Center Visual Sculpture */
    .visual-wrapper {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      width: 820px;
      height: 920px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .sculpture {
      width: 460px;
      height: 620px;
      background: linear-gradient(180deg, #27272a 0%, #111113 100%);
      clip-path: polygon(50% 0%, 80% 18%, 88% 45%, 78% 75%, 95% 100%, 5% 100%, 22% 75%, 12% 45%, 20% 18%);
      border-radius: 35px;
      filter: drop-shadow(0 0 50px rgba(245, 158, 11, 0.28));
    }

    /* Kinetic Subtitles Box */
    .caption-box {
      position: absolute;
      bottom: 20%;
      left: 8%;
      right: 8%;
      text-align: center;
      z-index: 10;
    }

    .caption-text {
      font-size: 70px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 4px 22px rgba(0, 0, 0, 0.95);
      line-height: 1.25;
      display: inline-block;
    }

    .gold {
      color: #fbbf24;
      text-shadow: 0 0 38px rgba(245, 158, 11, 0.85), 0 4px 16px rgba(0, 0, 0, 0.95);
    }

    .red {
      color: #ef4444;
      text-shadow: 0 0 38px rgba(239, 68, 68, 0.85), 0 4px 16px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>

  <div id="stage" data-composition-id="cold-rules-shorts" data-start="0" data-width="1080" data-height="1920">
    <div class="brand-tag">STOIC SHADOW</div>
    <div class="bg-gradient"></div>
    <div class="vignette"></div>

    <div class="visual-wrapper">
      <div id="hero-statue" class="sculpture"></div>
    </div>

    <div class="caption-box">
      <h1 id="caption-target" class="caption-text">
        3 <span class="gold">COLD RULES</span>
      </h1>
    </div>

    <audio
      id="main-voiceover"
      data-start="0"
      data-duration="38"
      data-track-index="0"
      data-volume="1.0"
      src="audio_cold_rules.mp3"
    ></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Breathing statue scale
      tl.to("#hero-statue", {
        scale: 1.07,
        duration: 19,
        ease: "power1.inOut",
        yoyo: true,
        repeat: 1
      }, 0);

      // Kinetic Synced Captions
      const timelineData = [
        { time: 0, text: "ADOPT THESE <span class='gold'>3 COLD RULES</span>" },
        { time: 2.8, text: "IF YOU WANT <span class='gold'>INSTANT RESPECT</span>" },
        { time: 5.5, text: "RULE 1: NEVER LAUGH AT <span class='red'>DISRESPECT</span>" },
        { time: 9.0, text: "WHEN THEY MAKE A JOKE ABOUT YOU..." },
        { time: 11.5, text: "DON'T SMILE TO BE <span class='gold'>POLITE</span>" },
        { time: 14.0, text: "STARE AT THEM <span class='gold'>SILENTLY</span>" },
        { time: 16.5, text: "UNTIL THE ROOM GOES <span class='red'>UNCOMFORTABLE</span>" },
        { time: 19.5, text: "RULE 2: SPEAK <span class='gold'>20% SLOWER</span>" },
        { time: 23.0, text: "INSECURE PEOPLE <span class='red'>RUSH WORDS</span>" },
        { time: 25.5, text: "POWERFUL PEOPLE <span class='gold'>CONTROL SILENCE</span>" },
        { time: 28.5, text: "RULE 3: WALK AWAY <span class='gold'>WITHOUT CLOSURE</span>" },
        { time: 31.8, text: "IF THEY BETRAY YOU... NEVER EXPLAIN" },
        { time: 34.0, text: "SILENCE IS THE LOUDEST <span class='red'>EXECUTION</span>" },
        { time: 36.5, text: "FULL 7 LAWS ➔ <span class='gold'>LINK IN BIO</span>" }
      ];

      timelineData.forEach(item => {
        tl.call(() => {
          document.getElementById("caption-target").innerHTML = item.text;
        }, null, item.time);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["cold-rules-shorts"] = tl;
    </script>
  </div>

</body>
</html>
