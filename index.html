<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The 4 Paths of Pain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050507;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #050507;
      overflow: hidden;
    }

    /* Cinematic Manga Grit Texture / Film Grain emulation */
    .film-grain {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 4px 4px;
      pointer-events: none;
      z-index: 25;
      opacity: 0.8;
    }

    /* Dramatic Dark Atmosphere Gradients */
    .ambient-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(220, 38, 38, 0.12) 0%, rgba(5, 5, 7, 0.98) 70%);
      z-index: 1;
      transition: background 0.5s ease;
    }

    /* Heavy Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 260px rgba(0, 0, 0, 0.98), inset 0 0 100px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 20;
    }

    /* High Brand Bar */
    .brand-header {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Cinzel', serif;
      font-size: 26px;
      letter-spacing: 12px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      z-index: 15;
    }

    /* Center Visual - Seinen / Manga / Sculpture Silhouette */
    .visual-stage {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 760px;
      height: 860px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .hero-panel {
      position: relative;
      width: 440px;
      height: 600px;
      background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
      clip-path: polygon(50% 0%, 85% 15%, 90% 45%, 82% 78%, 95% 100%, 5% 100%, 18% 78%, 10% 45%, 15% 15%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .inner-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.25) 0%, transparent 70%);
    }

    /* Category Tag (e.g. THE WEAK / THE STOIC) */
    .category-box {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      text-align: center;
      width: 90%;
    }

    .badge {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 32px;
      letter-spacing: 8px;
      font-weight: 900;
      padding: 10px 28px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: #a1a1aa;
      margin-bottom: 25px;
    }

    /* Subtitles / Philosophy Punchline */
    .caption-box {
      position: absolute;
      bottom: 18%;
      left: 6%;
      right: 6%;
      text-align: center;
      z-index: 10;
    }

    .caption-main {
      font-size: 68px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffffff;
      line-height: 1.25;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.98);
      display: inline-block;
    }

    /* Colors */
    .gold {
      color: #f59e0b;
      text-shadow: 0 0 45px rgba(245, 158, 11, 0.9), 0 4px 18px rgba(0, 0, 0, 0.95);
    }
    .red {
      color: #ef4444;
      text-shadow: 0 0 45px rgba(239, 68, 68, 0.9), 0 4px 18px rgba(0, 0, 0, 0.95);
    }
    .purple {
      color: #a855f7;
      text-shadow: 0 0 45px rgba(168, 85, 247, 0.9), 0 4px 18px rgba(0, 0, 0, 0.95);
    }
    .cyan {
      color: #38bdf8;
      text-shadow: 0 0 45px rgba(56, 189, 248, 0.9), 0 4px 18px rgba(0, 0, 0, 0.95);
    }

    /* Bottom Hook Sub-bar */
    .cta-sub {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.35);
      font-weight: 800;
      text-transform: uppercase;
      z-index: 15;
    }
  </style>
</head>
<body>

  <div id="stage" data-composition-id="paths-of-pain" data-start="0" data-width="1080" data-height="1920">
    <div class="brand-header">STOIC SHADOW</div>
    <div class="ambient-glow" id="glow-bg"></div>
    <div class="vignette"></div>
    <div class="film-grain"></div>

    <div class="visual-stage">
      <div id="character-silhouette" class="hero-panel">
        <div class="inner-glow" id="silhouette-glow"></div>
      </div>
    </div>

    <div class="category-box">
      <div id="badge-title" class="badge">WHEN PAIN HITS</div>
    </div>

    <div class="caption-box">
      <h1 id="caption-text" class="caption-main">
        FOUR MEN WALK <span class="red">FOUR PATHS</span>
      </h1>
    </div>

    <div class="cta-sub">STAY THREE STEPS AHEAD</div>

    <audio
      id="voice-track"
      data-start="0"
      data-duration="15"
      data-track-index="0"
      data-volume="1.0"
      src="audio_paths_of_pain.mp3"
    ></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Slow dynamic zoom on the character
      tl.to("#character-silhouette", {
        scale: 1.12,
        duration: 15,
        ease: "none"
      }, 0);

      // Pacing Breakdown synced with Christopher Voice
      // Total length: ~14.5s
      const steps = [
        {
          time: 0,
          badge: "REALITY CHECK",
          caption: "WHEN PAIN HITS...<br><span class='red'>FOUR PATHS</span> EXIST",
          glow: "radial-gradient(circle at 50% 45%, rgba(220, 38, 38, 0.15) 0%, rgba(5, 5, 7, 0.98) 70%)"
        },
        {
          time: 2.8,
          badge: "I. THE WEAK",
          caption: "BLAMES <span class='red'>THE WORLD</span>",
          glow: "radial-gradient(circle at 50% 45%, rgba(239, 68, 68, 0.22) 0%, rgba(5, 5, 7, 0.98) 70%)"
        },
        {
          time: 5.2,
          badge: "II. THE NIHILIST",
          caption: "SURRENDERS TO <span class='purple'>NOTHINGNESS</span>",
          glow: "radial-gradient(circle at 50% 45%, rgba(168, 85, 247, 0.22) 0%, rgba(5, 5, 7, 0.98) 70%)"
        },
        {
          time: 7.8,
          badge: "III. THE CYNIC",
          caption: "MOCKS <span class='cyan'>EVERYTHING</span>",
          glow: "radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.22) 0%, rgba(5, 5, 7, 0.98) 70%)"
        },
        {
          time: 9.8,
          badge: "IV. THE STOIC",
          caption: "CONVERTS PAIN INTO <span class='gold'>POWER</span>",
          glow: "radial-gradient(circle at 50% 45%, rgba(245, 158, 11, 0.3) 0%, rgba(5, 5, 7, 0.98) 70%)"
        },
        {
          time: 12.5,
          badge: "THE QUESTION",
          caption: "WHICH PATH ARE <span class='gold'>YOU WALKING?</span>",
          glow: "radial-gradient(circle at 50% 45%, rgba(245, 158, 11, 0.25) 0%, rgba(5, 5, 7, 0.98) 70%)"
        }
      ];

      steps.forEach(s => {
        tl.call(() => {
          document.getElementById("badge-title").innerText = s.badge;
          document.getElementById("caption-text").innerHTML = s.caption;
          document.getElementById("glow-bg").style.background = s.glow;
        }, null, s.time);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["paths-of-pain"] = tl;
    </script>
  </div>

</body>
</html>
