<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Untouchable - Cyber Glitch Comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Cinzel:wght@800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #090a0f;
      color: #f4f4f5;
      font-family: 'Archivo', sans-serif;
    }
    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #090a0f;
      overflow: hidden;
    }

    /* Scanlines effect (from frame-glitch-title) */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.3) 0px,
        rgba(0, 0, 0, 0.3) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: multiply;
      opacity: 0.8;
    }

    /* Cyber Grid */
    .grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Film Grain & Heavy Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.95) 100%);
    }

    /* Top HUD / Chrome */
    .hud {
      position: absolute;
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.5);
      z-index: 15;
    }
    .hud.tl { top: 80px; left: 70px; }
    .hud.tr { top: 80px; right: 70px; color: #ef4444; }
    .hud.bl { bottom: 80px; left: 70px; font-size: 20px; }
    .hud.br { bottom: 80px; right: 70px; font-size: 20px; color: #00f0ff; }

    /* Scene 1: Glitch Title Hook */
    #scene-hook {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      padding: 0 60px;
    }

    .kicker {
      font-family: 'Space Mono', monospace;
      font-size: 28px;
      letter-spacing: 8px;
      color: #ef4444;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    /* RGB Glitch Header */
    .glitch-host {
      position: relative;
      display: inline-block;
    }
    .glitch-title {
      font-size: 110px;
      font-weight: 900;
      line-height: 0.95;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: -2px;
      color: #ffffff;
    }
    .glitch-title.cyan {
      position: absolute;
      inset: 0;
      color: #00f0ff;
      transform: translate(-4px, 2px);
      mix-blend-mode: screen;
      opacity: 0.8;
    }
    .glitch-title.magenta {
      position: absolute;
      inset: 0;
      color: #ff2bd6;
      transform: translate(4px, -2px);
      mix-blend-mode: screen;
      opacity: 0.8;
    }

    .sub-hook {
      font-family: 'Space Mono', monospace;
      font-size: 32px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      margin-top: 40px;
      max-width: 850px;
      line-height: 1.4;
    }

    /* Scene 2: Head-to-Head Comparison (from frame-aicoding-comparison) */
    #scene-comparison {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 6;
      padding: 0 60px;
      opacity: 0;
      transform: scale(0.95);
    }

    .comp-badge {
      font-family: 'Space Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      padding: 12px 30px;
      border-radius: 999px;
      border: 1.5px solid rgba(0, 240, 255, 0.5);
      background: rgba(0, 240, 255, 0.08);
      color: #00f0ff;
      margin-bottom: 40px;
    }

    .comp-cards {
      display: flex;
      gap: 30px;
      width: 100%;
    }

    .comp-card {
      flex: 1;
      border-radius: 32px;
      padding: 50px 30px;
      text-align: center;
      position: relative;
    }

    .card-weak {
      background: rgba(239, 68, 68, 0.06);
      border: 2px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.15);
    }

    .card-stoic {
      background: rgba(245, 158, 11, 0.08);
      border: 2px solid rgba(245, 158, 11, 0.6);
      box-shadow: 0 0 70px rgba(245, 158, 11, 0.25);
    }

    .card-label {
      font-size: 52px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    .label-weak { color: #ef4444; }
    .label-stoic { color: #fbbf24; }

    .card-desc {
      font-size: 28px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 800;
      text-transform: uppercase;
    }

    .win-tag {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      background: #fbbf24;
      color: #000;
      letter-spacing: 2px;
    }

    /* Scene 3: Minimal Build Outro */
    #scene-outro {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 7;
      opacity: 0;
    }

    .outro-huge {
      font-family: 'Cinzel', serif;
      font-size: 120px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 0 0 60px rgba(245, 158, 11, 0.8), 0 4px 25px rgba(0,0,0,0.9);
      text-align: center;
    }
    .outro-sub {
      font-family: 'Space Mono', monospace;
      font-size: 26px;
      letter-spacing: 8px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 30px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="stage" data-composition-id="untouchable-short" data-start="0" data-width="1080" data-height="1920">
    <div class="grid"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- HUD Chrome -->
    <div class="hud tl">&gt;&gt; STOIC SHADOW // PROTOCOL</div>
    <div class="hud tr">REC ●</div>
    <div class="hud bl">CH-07 // MENTAL DEFENSE</div>
    <div class="hud br">SYSTEM ACTIVE</div>

    <!-- SCENE 1: GLITCH TITLE HOOK (0 - 4s) -->
    <div id="scene-hook">
      <div class="kicker">BRUTAL REALITY</div>
      <div class="glitch-host">
        <h1 class="glitch-title">NOBODY CARES</h1>
        <h1 class="glitch-title cyan">NOBODY CARES</h1>
        <h1 class="glitch-title magenta">NOBODY CARES</h1>
      </div>
      <p class="sub-hook">THEY ONLY TEST IF YOU BREAK.</p>
    </div>

    <!-- SCENE 2: HEAD TO HEAD COMPARISON (4 - 9s) -->
    <div id="scene-comparison">
      <div class="comp-badge">&gt;&gt; THE REACTION TEST &lt;&lt;</div>
      <div class="comp-cards">
        <div class="comp-card card-weak">
          <div class="card-label label-weak">THE WEAK</div>
          <p class="card-desc">ARGUES TO DEFEND HIS EGO</p>
        </div>
        <div class="comp-card card-stoic">
          <div class="win-tag">WIN</div>
          <div class="card-label label-stoic">DANGEROUS</div>
          <p class="card-desc">STAYS SILENT.<br>CONTROLS THE ROOM.</p>
        </div>
      </div>
    </div>

    <!-- SCENE 3: FINAL OUTRO STATEMENT (9 - 12s) -->
    <div id="scene-outro">
      <h1 class="outro-huge">UNTOUCHABLE</h1>
      <p class="outro-sub">7 LAWS IN BIO ➔</p>
    </div>

    <!-- Audio Track: Voiceover -->
    <audio
      id="main-voice"
      data-start="0"
      data-duration="12"
      data-track-index="0"
      data-volume="1.0"
      src="audio_untouchable.mp3"
    ></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Scene 1: Glitch Shake & Fade Out at 3.8s
      tl.to(".glitch-host", {
        x: 8,
        repeat: 5,
        yoyo: true,
        duration: 0.08,
        ease: "power2.inOut"
      }, 0.5);

      tl.to("#scene-hook", {
        opacity: 0,
        scale: 0.9,
        duration: 0.35,
        ease: "power2.in"
      }, 3.8);

      // Scene 2: Pop Comparison Cards in at 4.0s
      tl.to("#scene-comparison", {
        opacity: 1,
        scale: 1,
        duration: 0.45,
        ease: "back.out(1.5)"
      }, 4.0);

      // Shake on the dangerous card
      tl.to(".card-stoic", {
        scale: 1.05,
        duration: 0.2,
        yoyo: true,
        repeat: 1,
        ease: "power1.inOut"
      }, 6.2);

      tl.to("#scene-comparison", {
        opacity: 0,
        scale: 1.08,
        duration: 0.35,
        ease: "power2.in"
      }, 8.8);

      // Scene 3: Outro Stamp at 9.0s
      tl.to("#scene-outro", {
        opacity: 1,
        scale: 1,
        duration: 0.4,
        ease: "power3.out"
      }, 9.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["untouchable-short"] = tl;
    </script>
  </div>

</body>
</html>
